<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        --accent: #34ace0;
        --bg: rgba(10, 12, 24, 0.92);
        --text: #f2f6ff;
        --error: #ff6b6b;
        --success: #6be585;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background: transparent;
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .container {
        width: 360px;
        background: var(--bg);
        border-radius: 14px;
        padding: 26px 32px 32px;
        box-shadow: 0 16px 42px rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      h1 {
        font-weight: 600;
        font-size: 1.65rem;
        margin: 0 0 24px;
        text-align: center;
        letter-spacing: 0.02em;
      }

      label {
        display: block;
        font-size: 0.85rem;
        margin-bottom: 6px;
        letter-spacing: 0.03em;
        color: rgba(242, 246, 255, 0.85);
      }

      input {
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 18px;
        font-size: 1rem;
        transition: border 0.2s ease, background 0.2s ease;
      }

      input:focus {
        outline: none;
        border-color: var(--accent);
        background: rgba(52, 172, 224, 0.08);
      }

      button {
        margin-top: 4px;
        width: 100%;
        padding: 12px;
        font-size: 1.05rem;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: #04111f;
        font-weight: 600;
        cursor: pointer;
        letter-spacing: 0.05em;
        transition: filter 0.2s ease, transform 0.2s ease;
      }

      button:disabled {
        cursor: not-allowed;
        filter: grayscale(0.4);
        opacity: 0.75;
      }

      button:not(:disabled):hover {
        filter: brightness(1.1);
        transform: translateY(-1px);
      }

      .status {
        min-height: 22px;
        text-align: center;
        font-size: 0.9rem;
        margin-top: 16px;
      }

      .status.error {
        color: var(--error);
      }

      .status.success {
        color: var(--success);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Register</h1>
      <form id="registration-form">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="off" minlength="3" maxlength="32" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" minlength="6" maxlength="64" required />

        <button type="submit">Join Server</button>
      </form>
      <div id="status" class="status"></div>
    </div>

    <script>
      const form = document.getElementById('registration-form');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const statusEl = document.getElementById('status');

      function setStatus(message, type = '') {
        statusEl.textContent = message || '';
        statusEl.className = `status ${type}`.trim();
      }

      function setDisabled(isDisabled) {
        usernameInput.disabled = isDisabled;
        passwordInput.disabled = isDisabled;
        form.querySelector('button').disabled = isDisabled;
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();

        if (username.length < 3) {
          setStatus('Username must be at least 3 characters.', 'error');
          return;
        }

        if (password.length < 6) {
          setStatus('Password must be at least 6 characters.', 'error');
          return;
        }

        setStatus('Submitting registration...', '');
        setDisabled(true);

        if (typeof mp !== 'undefined' && mp.trigger) {
          mp.trigger('cef:auth:submit', username, password);
        } else {
          console.warn('mp.trigger not available - running in browser preview');
        }
      });

      window.handleRegistrationResult = function handleRegistrationResult(success, message) {
        const type = success ? 'success' : 'error';
        setStatus(message, type);
        setDisabled(success);
      };

      window.resetForm = function resetForm() {
        setDisabled(false);
        usernameInput.value = '';
        passwordInput.value = '';
        setStatus('');
      };
    </script>
  </body>
</html>
